<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Planner"/>
<title>Planner</title>
<style>
:root{
--bg:#000;--bg2:#1C1C1E;--bg3:#2C2C2E;--bg4:#3A3A3C;
--l:rgba(255,255,255,1);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.25);--l4:rgba(255,255,255,.08);
--blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--purple:#BF5AF2;--teal:#5AC8FA;--yellow:#FFD60A;
--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
--tabh:83px;--safeb:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--l);font-family:var(--font);overflow:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:var(--font);}
#root{position:fixed;inset:0;max-width:430px;margin:0 auto;display:flex;flex-direction:column;}
#scroller{position:absolute;top:0;left:0;right:0;bottom:var(--tabh);overflow-y:scroll;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:20px;}
#scroller::-webkit-scrollbar{display:none;}
#tabs{position:absolute;bottom:0;left:0;right:0;height:var(--tabh);background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--l4);padding:8px 0 var(--safeb);display:flex;}
.hdr{padding:52px 20px 10px;}
.hdr-eye{font-size:13px;font-weight:500;color:var(--l2);letter-spacing:.2px;margin-bottom:4px;}
.hdr-title{font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.05;}
.card{background:var(--bg2);border-radius:16px;margin:10px 16px 0;overflow:hidden;}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 9px;}
.card-label{font-size:12px;font-weight:600;color:var(--l2);letter-spacing:.6px;text-transform:uppercase;}
.card-btn{font-size:15px;font-weight:500;color:var(--blue);}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--l4);}
.row:last-child{border-bottom:none;}
.row.dim{opacity:.28;}
.row-time{font-size:13px;color:var(--l3);min-width:40px;font-variant-numeric:tabular-nums;}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.chk.on{border-color:transparent;}
.row-label{flex:1;font-size:15px;}
.row-badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.prog{background:var(--bg2);border-radius:14px;margin:8px 16px 0;padding:12px 16px;}
.prog-hdr{display:flex;justify-content:space-between;margin-bottom:7px;}
.prog-hdr span{font-size:12px;color:var(--l2);font-weight:500;}
.prog-track{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .5s ease;}
#tabs{position:absolute;bottom:0;left:0;right:0;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--l4);padding:8px 0 var(--safeb);display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--l3);font-size:10px;font-weight:500;letter-spacing:.3px;transition:color .15s;}
.tab.on{color:var(--blue);}
.ti{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.ti-day{font-size:16px;font-weight:700;}
.ti-week{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;width:18px;}
.ti-week span{height:3px;border-radius:1px;background:currentColor;display:block;}
.ti-pay{font-size:18px;font-weight:300;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:12px 0 calc(var(--safeb)+8px);animation:slideUp .28s cubic-bezier(.32,1.25,.47,1);}
.sh-handle{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 14px;}
.sh-title{font-size:13px;font-weight:600;color:var(--l2);text-align:center;letter-spacing:.5px;text-transform:uppercase;}
.sh-sub{font-size:17px;font-weight:600;text-align:center;padding:4px 20px 14px;}
.sh-opt{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--l4);cursor:pointer;}
.sh-opt:last-of-type{border-bottom:none;}
.sh-opt-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.sh-opt-name{font-size:16px;font-weight:500;flex:1;}
.sh-opt-sub{font-size:13px;color:var(--l3);margin-top:1px;}
.sh-chk{font-size:18px;font-weight:700;color:var(--blue);}
.sh-cancel{text-align:center;padding:14px;font-size:16px;color:var(--blue);font-weight:500;cursor:pointer;border-top:1px solid var(--l4);margin-top:6px;}
.sh-dest{text-align:center;padding:14px;font-size:16px;color:var(--red);font-weight:500;cursor:pointer;}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 16px;}
.hg-btn{padding:16px 0;background:var(--bg3);border-radius:12px;font-size:20px;font-weight:300;color:var(--l2);transition:all .15s;}
.hg-btn.on{background:var(--blue);color:#fff;font-weight:500;}
.add-form{padding:0 16px 12px;}
.add-inp{width:100%;background:var(--bg3);border:none;color:var(--l);padding:11px 13px;border-radius:10px;font-size:16px;margin-bottom:8px;outline:none;}
.add-inp::placeholder{color:var(--l3);}
.add-time{width:100%;background:var(--bg3);border:none;color:var(--l2);padding:10px 13px;border-radius:10px;font-size:15px;margin-bottom:10px;outline:none;}
.add-submit{width:100%;padding:13px;background:var(--blue);border-radius:10px;font-size:16px;font-weight:600;color:#fff;}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--l4);cursor:pointer;}
.wrow:last-child{border-bottom:none;}
.wrow.sel{background:rgba(255,255,255,.04);}
.wdn{text-align:center;min-width:34px;}
.wdn .name{font-size:11px;font-weight:600;color:var(--l3);letter-spacing:.5px;text-transform:uppercase;}
.wdn .num{font-size:20px;font-weight:300;color:var(--l2);}
.wdn.today .name{color:var(--blue);}
.wdn.today .num{color:var(--l);font-weight:500;}
.wsep{width:1px;height:36px;background:var(--l4);}
.wi{flex:1;}
.wi-shift{font-size:14px;font-weight:500;margin-bottom:2px;}
.wi-hrs{font-size:12px;color:var(--l3);}
.wcl-btn{padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg4);color:var(--l2);flex-shrink:0;}
.wcl-btn.cl{background:rgba(255,69,58,.15);color:var(--red);}
.pay-big{background:var(--bg2);border-radius:16px;margin:10px 16px 0;padding:20px 20px 16px;}
.pay-eye{font-size:12px;font-weight:600;color:var(--l2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;}
.pay-amt{font-size:52px;font-weight:200;letter-spacing:-1.5px;line-height:1;margin-bottom:6px;}
.pay-sub{font-size:13px;color:var(--l3);}
.pprog{padding:14px 0 0;}
.pprog-hdr{display:flex;justify-content:space-between;margin-bottom:6px;}
.pprog-hdr span{font-size:12px;color:var(--l2);font-weight:500;}
.pprog-track{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.pprog-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.pay-max{background:var(--bg2);border-radius:16px;margin:8px 16px 0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.pm-ey{font-size:11px;color:var(--l3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.pm-val{font-size:24px;font-weight:300;color:var(--l2);}
.pm-rem{font-size:20px;font-weight:300;color:var(--l3);}
.brow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--l4);}
.brow:last-child{border-bottom:none;}
.brow-t{font-size:15px;font-weight:400;}
.brow-s{font-size:12px;color:var(--l3);margin-top:1px;}
.brow-v{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;}
.det-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--l4);}
.det-row:last-child{border-bottom:none;}
.det-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.det-label{flex:1;font-size:14px;color:var(--l2);}
.det-t{font-size:12px;color:var(--l3);}
.det-v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px;}
.mnav-title{font-size:17px;font-weight:600;}
.mnav-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--l2);}
.dep{background:var(--bg2);border-radius:14px;margin:8px 16px 0;padding:13px 16px;}
.dep-row{display:flex;align-items:center;justify-content:space-between;}
.dep-t{font-size:16px;font-weight:600;margin-bottom:2px;}
.dep-s{font-size:12px;color:var(--l3);}
.dep-btn{padding:7px 14px;background:var(--bg4);border-radius:20px;font-size:13px;font-weight:500;color:var(--l2);}
.dep-btn.logged{color:var(--blue);}
.gc-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--l4);cursor:pointer;}
.gc-row:last-of-type{border-bottom:none;}
.gc-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.gc-chk.on{background:var(--yellow);border-color:var(--yellow);}
.gc-label{font-size:15px;}
.gc-row.done .gc-label{color:var(--l3);text-decoration:line-through;}
.nr{display:flex;gap:8px;padding:10px 16px;}
.nr-btn{flex:1;padding:11px;background:var(--bg3);border-radius:10px;font-size:15px;font-weight:500;color:var(--l2);text-align:center;cursor:pointer;}
.ex-section{padding:8px 16px 12px;}
.ex-item{background:var(--bg3);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.ex-type{font-size:15px;font-weight:500;margin-bottom:2px;}
.ex-hrs{font-size:13px;color:var(--l2);}
.ex-del{font-size:13px;color:var(--red);padding:5px 11px;background:rgba(255,69,58,.1);border-radius:8px;}
.ex-add{width:100%;padding:12px;background:var(--bg3);border-radius:12px;font-size:15px;font-weight:500;color:var(--blue);text-align:center;}
.exhint{padding:10px 16px 2px;font-size:12px;color:var(--l3);}
/* Calendar month view */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;}
.cal-nav-title{font-size:17px;font-weight:600;}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--l2);}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 6px;}
.cal-wday{text-align:center;font-size:10px;font-weight:600;color:var(--l3);letter-spacing:.5px;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px 16px;}
.cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;border-radius:10px;min-height:46px;gap:3px;cursor:pointer;}
.cal-cell.we{background:rgba(255,255,255,.03);}
.cal-cell.today-cell{background:var(--blue);}
.cal-cell.sel-cell{border:1px solid var(--blue);}
.cal-cell.today-cell.sel-cell{border:none;}
.cal-num{font-size:14px;font-weight:400;color:var(--l2);}
.cal-cell.today-cell .cal-num{color:#fff;font-weight:700;}
.cal-cell.sel-cell:not(.today-cell) .cal-num{color:var(--blue);font-weight:600;}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
/* Day nav */
.day-nav{display:flex;align-items:center;gap:8px;padding:8px 16px 0;}
.day-nav-btn{width:36px;height:36px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--l2);flex-shrink:0;}
.day-nav-label{flex:1;text-align:center;font-size:13px;color:var(--l2);font-weight:500;}
.day-nav-today{font-size:12px;color:var(--blue);font-weight:600;padding:6px 12px;background:rgba(10,132,255,.1);border-radius:14px;flex-shrink:0;}
#sd{position:fixed;top:calc(env(safe-area-inset-top,12px)+8px);right:16px;width:7px;height:7px;border-radius:50%;z-index:999;transition:background .3s;}
#sd.sy{background:var(--orange);}#sd.ok{background:var(--green);}#sd.er{background:var(--red);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

/* AMIN HOME + WORLD */
#homeGate{position:fixed;inset:0;z-index:1200;max-width:430px;margin:auto;background:#000;padding:calc(env(safe-area-inset-top,20px) + 34px) 18px 28px;overflow:auto;transition:opacity .38s,transform .55s cubic-bezier(.2,.85,.2,1)}
#homeGate.away{opacity:0;transform:scale(.94) translateY(-10px);pointer-events:none}.home-eye{font-size:13px;color:var(--l2);font-weight:600}.home-title{font-size:38px;font-weight:750;letter-spacing:-1.4px;margin:5px 0 28px}.home-card{height:245px;width:100%;border-radius:28px;padding:24px;margin-bottom:16px;position:relative;overflow:hidden;border:1px solid var(--l4);text-align:left;transition:transform .18s}.home-card:active{transform:scale(.975)}.home-job{background:linear-gradient(145deg,#202024,#101012)}.home-world{background:radial-gradient(circle at 75% 25%,#20304d 0,#11182a 28%,#090b12 62%,#050506 100%)}.home-ic{font-size:42px}.home-card h2{font-size:29px;margin:14px 0 5px}.home-card p{color:var(--l2);font-size:14px}.home-arr{position:absolute;right:22px;bottom:20px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:24px}.mini-globe{position:absolute;width:180px;height:180px;border-radius:50%;right:-42px;top:-50px;background:radial-gradient(circle at 35% 30%,#f5c96c,#7b4b16 25%,#17264b 48%,#080a12 72%);opacity:.58;box-shadow:0 0 55px rgba(255,190,70,.18)}
#jobBack{position:fixed;z-index:100;top:calc(env(safe-area-inset-top,12px) + 7px);left:max(12px,calc((100vw - 430px)/2 + 12px));width:34px;height:34px;border-radius:50%;background:rgba(44,44,46,.86);backdrop-filter:blur(15px);font-size:24px;color:var(--blue);display:none;align-items:center;justify-content:center}body.in-job #jobBack{display:flex}body.in-job .hdr{padding-top:64px}
#worldView{position:fixed;inset:0;z-index:1100;max-width:430px;margin:auto;background:radial-gradient(circle at 50% 42%,#132039,#05070d 55%,#000 100%);overflow:hidden;transform:translateX(100%);transition:transform .55s cubic-bezier(.2,.85,.2,1)}#worldView.open{transform:none}.world-top{position:absolute;z-index:8;top:calc(env(safe-area-inset-top,12px) + 8px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}.ios-back{width:38px;height:38px;border-radius:50%;background:rgba(28,28,30,.8);backdrop-filter:blur(16px);font-size:25px;color:var(--blue)}.day-pill{background:rgba(28,28,30,.78);backdrop-filter:blur(16px);padding:9px 13px;border-radius:18px;font-size:11px;color:#ddd}.world-space{position:absolute;inset:0;touch-action:pan-x}.stars{position:absolute;inset:-20%;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:43px 43px;opacity:.16}.world-globe{--rot:0deg;position:absolute;width:600px;height:600px;border-radius:50%;left:50%;top:46%;transform:translate(-50%,-50%) rotate(var(--rot));background:radial-gradient(circle at 35% 27%,rgba(255,255,255,.18),transparent 18%),radial-gradient(circle at 50% 48%,#294d58,#162c39 35%,#0a1725 65%,#02040a 78%);box-shadow:inset -55px -40px 90px #000,0 0 90px rgba(65,130,255,.16);transition:transform .65s cubic-bezier(.2,.85,.2,1)}.kingdom{position:absolute;width:150px;height:120px;border-radius:52% 48% 55% 45%;display:grid;place-items:center;text-align:center;padding:10px;filter:drop-shadow(0 8px 12px #0008);transition:transform .65s,filter .65s}.kingdom strong{font-size:16px}.kingdom span{font-size:11px;display:block;margin-top:4px}.k0{left:205px;top:55px;background:linear-gradient(145deg,#6b1518,#e13b32)}.k1{left:370px;top:205px;background:linear-gradient(145deg,#7d4310,#f5b83f)}.k2{left:210px;top:395px;background:linear-gradient(145deg,#34125c,#8d42d7)}.k3{left:45px;top:220px;background:linear-gradient(145deg,#123b6f,#3287dc)}.k4{left:78px;top:95px;width:92px;height:72px;background:linear-gradient(145deg,#386a32,#86b85e);opacity:.78}.kingdom.focus{transform:scale(1.23);filter:drop-shadow(0 0 24px rgba(255,255,255,.3));z-index:4}.bounty{position:absolute;z-index:5;top:100px;left:50%;transform:translateX(-50%);font-size:10px;color:#d8b46a;background:#17120bcc;border:1px solid #7c5b28;padding:7px 10px;border-radius:15px;white-space:nowrap}.world-panel{position:absolute;z-index:7;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,15px) + 18px);background:rgba(28,28,30,.8);backdrop-filter:blur(22px);border:1px solid var(--l4);border-radius:22px;padding:16px}.wp-top{display:flex;justify-content:space-between}.wp-name{font-size:21px;font-weight:750}.wp-progress{height:5px;background:#3a3a3c;border-radius:5px;margin:12px 0;overflow:hidden}.wp-fill{height:100%;background:#fff;border-radius:5px}.wp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wp-stat{background:rgba(255,255,255,.06);padding:9px;border-radius:11px}.wp-stat small{display:block;color:#aaa;margin-top:3px}.wp-hint{text-align:center;font-size:11px;color:#999;margin-top:10px}
.rate-list{padding:0 16px 12px}.rate-row{display:grid;grid-template-columns:1fr 1fr 86px;gap:7px;align-items:center;margin-bottom:7px}.rate-row select,.rate-row input{min-width:0;background:var(--bg3);border:0;color:#fff;border-radius:9px;padding:10px 8px;font-size:13px}.rate-save{width:100%;padding:11px;background:var(--blue);border-radius:10px;font-weight:600;margin-top:4px}

function vec(lat,lon){var a=lat*Math.PI/180,b=lon*Math.PI/180,c=Math.cos(a);return [c*Math.cos(b),Math.sin(a),c*Math.sin(b)]}function rot(v){var cy=Math.cos(yaw),sy=Math.sin(yaw),x=cy*v[0]+sy*v[2],z=-sy*v[0]+cy*v[2],cp=Math.cos(pitch),sp=Math.sin(pitch);return [x,cp*v[1]-sp*z,sp*v[1]+cp*z]}
function projectMarkers(){var box=canvas.getBoundingClientRect(),f=(box.height*.5)/Math.tan(.78/2);plats.forEach(function(p,i){var v=rot(vec(p.lat,p.lon)),el=document.getElementById('wm'+i);if(!el)return;var zz=zoom-v[2];if(v[2]<-.12){el.classList.add('hide');return}el.classList.remove('hide');var x=box.width/2+v[0]*f/zz,y=box.height/2-v[1]*f/zz;el.style.left=x+'px';el.style.top=y+'px';var sc=Math.max(.72,Math.min(1.08,2.25/zz));el.style.transform='translate(-50%,-50%) scale('+sc+')'})}
function buildMarkers(){var m=document.getElementById('worldMarkers');m.innerHTML='';plats.forEach(function(p,i){var b=document.createElement('button');b.className='w3d-marker';b.id='wm'+i;b.style.setProperty('--mc',p.c);b.innerHTML='<span class="mi">'+p.icon+'</span><strong>'+p.name+'</strong><small>'+short(p.now)+' → '+short(p.goal)+'</small>';b.onclick=function(e){e.stopPropagation();focusWorld(i)};m.appendChild(b)})}
function setupTouch(){var el=document.getElementById('worldSpace');function point(t){return{x:t.clientX,y:t.clientY}}el.addEventListener('touchstart',function(e){auto=false;if(e.touches.length===2){pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom0=targetZoom;drag=null}else{var p=point(e.touches[0]);drag={x:p.x,y:p.y,yaw:targetYaw,pitch:targetPitch}}},{passive:true});el.addEventListener('touchmove',function(e){if(e.cancelable)e.preventDefault();if(e.touches.length===2&&pinch0){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);targetZoom=Math.max(2.05,Math.min(4.1,zoom0*pinch0/d));return}if(!drag)return;var p=point(e.touches[0]);targetYaw=drag.yaw+(p.x-drag.x)*.0085;targetPitch=Math.max(-.72,Math.min(.72,drag.pitch+(p.y-drag.y)*.007))},{passive:false});el.addEventListener('touchend',function(){drag=null;pinch0=0},{passive:true})}
function short(n){if(n>=1e6)return (n/1e6).toFixed(n%1e6?1:0)+'M';if(n>=1e3)return (n/1e3).toFixed(n%1e3?1:0)+'K';return String(n)}
function loadWorld3(){try{var x=JSON.parse(localStorage.getItem('aminWorld')||'null');if(x){if(x.platforms)x.platforms.forEach(function(v,i){if(plats[i]&&v.now!=null)plats[i].now=+v.now});window.worldMeta=window.worldMeta||{socialIncome:0};if(x.socialIncome!=null)worldMeta.socialIncome=+x.socialIncome}}catch(e){}buildMarkers()}
function renderWorld3(){var total=plats.slice(0,4).reduce(function(a,p){return a+p.now},0);var a=document.getElementById('twFollowers');if(a)a.textContent=short(total);a=document.getElementById('twSocial');if(a)a.textContent='€'+Math.round((window.worldMeta&&worldMeta.socialIncome)||0).toLocaleString('de-DE');try{a=document.getElementById('twWork');if(a)a.textContent='€'+Math.round(calcPay(new Date().getFullYear(),new Date().getMonth()).netto).toLocaleString('de-DE')}catch(e){}buildMarkers()}
window.openWorld=function(){document.getElementById('homeGate').classList.add('away');document.getElementById('worldView').classList.add('open');auto=true;targetYaw=-.28;targetPitch=.10;targetZoom=2.75;loadWorld3();renderWorld3()};window.closeWorld=function(){closeWorldDrawer();document.getElementById('worldView').classList.remove('open');setTimeout(function(){document.getElementById('homeGate').classList.remove('away')},250)};
window.focusWorld=function(i){i=(i+plats.length)%plats.length;window.worldIndex=i;var p=plats[i];auto=false;targetYaw=-(p.lon*Math.PI/180);targetPitch=-(p.lat*Math.PI/180)*.72;targetZoom=2.28;setTimeout(function(){var d=document.getElementById('worldDrawer');document.getElementById('wpIcon').textContent=p.icon;document.getElementById('wpIcon').style.background='linear-gradient(145deg,'+p.c+',#121216)';document.getElementById('wpName').textContent=p.name;document.getElementById('wpGoal').textContent=short(p.now)+' → '+short(p.goal);document.getElementById('wpStart').textContent=short(p.start);document.getElementById('wpNow').textContent=short(p.now);document.getElementById('wpGain').textContent='+'+short(Math.max(0,p.now-p.start));document.getElementById('worldEdit').style.display='none';d.classList.add('open')},360)};
window.closeWorldDrawer=function(){var d=document.getElementById('worldDrawer');if(d)d.classList.remove('open');targetZoom=2.75};window.worldTab=function(t){if(t==='world'){closeWorldDrawer();auto=true;return}if(t==='add'){focusWorld(window.worldIndex||0);setTimeout(function(){document.getElementById('worldEdit').style.display='grid';document.getElementById('worldNowInput').value=plats[window.worldIndex||0].now;document.getElementById('worldIncomeInput').value=(window.worldMeta&&worldMeta.socialIncome)||0},420);return}if(t==='stats'){alert('Stats will fill automatically when social sync is connected.');return}if(t==='log'){alert('Voyage Journal will keep your daily snapshots here.')}};
window.saveWorldEdit=function(){var i=window.worldIndex||0,n=parseFloat(document.getElementById('worldNowInput').value),inc=parseFloat(document.getElementById('worldIncomeInput').value);if(!isNaN(n))plats[i].now=n;window.worldMeta=window.worldMeta||{socialIncome:0};if(!isNaN(inc))worldMeta.socialIncome=inc;try{localStorage.setItem('aminWorld',JSON.stringify({platforms:plats.map(function(p){return{now:p.now}}),socialIncome:worldMeta.socialIncome}))}catch(e){}renderWorld3();focusWorld(i)};
window.addEventListener('load',function(){try{initGL()}catch(e){console.error('3D init',e)}});
})();
