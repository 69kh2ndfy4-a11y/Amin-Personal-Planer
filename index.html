<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Planner"/>
<title>Planner</title>
<style>
:root{
  --bg:#000;--bg2:#1C1C1E;--bg3:#2C2C2E;--bg4:#3A3A3C;
  --l:rgba(255,255,255,1);--l2:rgba(255,255,255,.55);--l3:rgba(255,255,255,.25);--l4:rgba(255,255,255,.08);
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--red:#FF453A;--purple:#BF5AF2;--teal:#5AC8FA;--yellow:#FFD60A;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --tabh:83px;--safeb:env(safe-area-inset-bottom,20px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--l);font-family:var(--font);overflow:hidden;}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:var(--font);}
#root{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;}
#scroller{flex:1;min-height:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:20px;}
#scroller::-webkit-scrollbar{display:none;}
#tabs{flex-shrink:0;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--l4);padding:8px 0 var(--safeb);display:flex;}
.hdr{padding:52px 20px 10px;}
.hdr-eye{font-size:13px;font-weight:500;color:var(--l2);letter-spacing:.2px;margin-bottom:4px;}
.hdr-title{font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.05;}
.card{background:var(--bg2);border-radius:16px;margin:10px 16px 0;overflow:hidden;}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:13px 16px 9px;}
.card-label{font-size:12px;font-weight:600;color:var(--l2);letter-spacing:.6px;text-transform:uppercase;}
.card-btn{font-size:15px;font-weight:500;color:var(--blue);}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--l4);}
.row:last-child{border-bottom:none;}
.row.dim{opacity:.28;}
.row-time{font-size:13px;color:var(--l3);min-width:40px;font-variant-numeric:tabular-nums;}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);}
.chk.on{border-color:transparent;}
.row-label{flex:1;font-size:15px;}
.row-badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.prog{background:var(--bg2);border-radius:14px;margin:8px 16px 0;padding:12px 16px;}
.prog-hdr{display:flex;justify-content:space-between;margin-bottom:7px;}
.prog-hdr span{font-size:12px;color:var(--l2);font-weight:500;}
.prog-track{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;transition:width .5s ease;}
#tabs{position:absolute;bottom:0;left:0;right:0;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--l4);padding:8px 0 var(--safeb);display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--l3);font-size:10px;font-weight:500;letter-spacing:.3px;transition:color .15s;}
.tab.on{color:var(--blue);}
.ti{width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
.ti-day{font-size:16px;font-weight:700;}
.ti-week{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;width:18px;}
.ti-week span{height:3px;border-radius:1px;background:currentColor;display:block;}
.ti-pay{font-size:18px;font-weight:300;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:12px 0 calc(var(--safeb)+8px);animation:slideUp .28s cubic-bezier(.32,1.25,.47,1);}
.sh-handle{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 14px;}
.sh-title{font-size:13px;font-weight:600;color:var(--l2);text-align:center;letter-spacing:.5px;text-transform:uppercase;}
.sh-sub{font-size:17px;font-weight:600;text-align:center;padding:4px 20px 14px;}
.sh-opt{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--l4);cursor:pointer;}
.sh-opt:last-of-type{border-bottom:none;}
.sh-opt-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.sh-opt-name{font-size:16px;font-weight:500;flex:1;}
.sh-opt-sub{font-size:13px;color:var(--l3);margin-top:1px;}
.sh-chk{font-size:18px;font-weight:700;color:var(--blue);}
.sh-cancel{text-align:center;padding:14px;font-size:16px;color:var(--blue);font-weight:500;cursor:pointer;border-top:1px solid var(--l4);margin-top:6px;}
.sh-dest{text-align:center;padding:14px;font-size:16px;color:var(--red);font-weight:500;cursor:pointer;}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 16px;}
.hg-btn{padding:16px 0;background:var(--bg3);border-radius:12px;font-size:20px;font-weight:300;color:var(--l2);transition:all .15s;}
.hg-btn.on{background:var(--blue);color:#fff;font-weight:500;}
.add-form{padding:0 16px 12px;}
.add-inp{width:100%;background:var(--bg3);border:none;color:var(--l);padding:11px 13px;border-radius:10px;font-size:16px;margin-bottom:8px;outline:none;}
.add-inp::placeholder{color:var(--l3);}
.add-time{width:100%;background:var(--bg3);border:none;color:var(--l2);padding:10px 13px;border-radius:10px;font-size:15px;margin-bottom:10px;outline:none;}
.add-submit{width:100%;padding:13px;background:var(--blue);border-radius:10px;font-size:16px;font-weight:600;color:#fff;}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--l4);cursor:pointer;}
.wrow:last-child{border-bottom:none;}
.wrow.sel{background:rgba(255,255,255,.04);}
.wdn{text-align:center;min-width:34px;}
.wdn .name{font-size:11px;font-weight:600;color:var(--l3);letter-spacing:.5px;text-transform:uppercase;}
.wdn .num{font-size:20px;font-weight:300;color:var(--l2);}
.wdn.today .name{color:var(--blue);}
.wdn.today .num{color:var(--l);font-weight:500;}
.wsep{width:1px;height:36px;background:var(--l4);}
.wi{flex:1;}
.wi-shift{font-size:14px;font-weight:500;margin-bottom:2px;}
.wi-hrs{font-size:12px;color:var(--l3);}
.wcl-btn{padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg4);color:var(--l2);flex-shrink:0;}
.wcl-btn.cl{background:rgba(255,69,58,.15);color:var(--red);}
.pay-big{background:var(--bg2);border-radius:16px;margin:10px 16px 0;padding:20px 20px 16px;}
.pay-eye{font-size:12px;font-weight:600;color:var(--l2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;}
.pay-amt{font-size:52px;font-weight:200;letter-spacing:-1.5px;line-height:1;margin-bottom:6px;}
.pay-sub{font-size:13px;color:var(--l3);}
.pprog{padding:14px 0 0;}
.pprog-hdr{display:flex;justify-content:space-between;margin-bottom:6px;}
.pprog-hdr span{font-size:12px;color:var(--l2);font-weight:500;}
.pprog-track{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.pprog-fill{height:100%;border-radius:2px;transition:width .5s ease;}
.pay-max{background:var(--bg2);border-radius:16px;margin:8px 16px 0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.pm-ey{font-size:11px;color:var(--l3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.pm-val{font-size:24px;font-weight:300;color:var(--l2);}
.pm-rem{font-size:20px;font-weight:300;color:var(--l3);}
.brow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--l4);}
.brow:last-child{border-bottom:none;}
.brow-t{font-size:15px;font-weight:400;}
.brow-s{font-size:12px;color:var(--l3);margin-top:1px;}
.brow-v{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;}
.det-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--l4);}
.det-row:last-child{border-bottom:none;}
.det-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.det-label{flex:1;font-size:14px;color:var(--l2);}
.det-t{font-size:12px;color:var(--l3);}
.det-v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px;}
.mnav-title{font-size:17px;font-weight:600;}
.mnav-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--l2);}
.dep{background:var(--bg2);border-radius:14px;margin:8px 16px 0;padding:13px 16px;}
.dep-row{display:flex;align-items:center;justify-content:space-between;}
.dep-t{font-size:16px;font-weight:600;margin-bottom:2px;}
.dep-s{font-size:12px;color:var(--l3);}
.dep-btn{padding:7px 14px;background:var(--bg4);border-radius:20px;font-size:13px;font-weight:500;color:var(--l2);}
.dep-btn.logged{color:var(--blue);}
.gc-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--l4);cursor:pointer;}
.gc-row:last-of-type{border-bottom:none;}
.gc-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg4);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.gc-chk.on{background:var(--yellow);border-color:var(--yellow);}
.gc-label{font-size:15px;}
.gc-row.done .gc-label{color:var(--l3);text-decoration:line-through;}
.nr{display:flex;gap:8px;padding:10px 16px;}
.nr-btn{flex:1;padding:11px;background:var(--bg3);border-radius:10px;font-size:15px;font-weight:500;color:var(--l2);text-align:center;cursor:pointer;}
.ex-section{padding:8px 16px 12px;}
.ex-item{background:var(--bg3);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.ex-type{font-size:15px;font-weight:500;margin-bottom:2px;}
.ex-hrs{font-size:13px;color:var(--l2);}
.ex-del{font-size:13px;color:var(--red);padding:5px 11px;background:rgba(255,69,58,.1);border-radius:8px;}
.ex-add{width:100%;padding:12px;background:var(--bg3);border-radius:12px;font-size:15px;font-weight:500;color:var(--blue);text-align:center;}
#sd{position:fixed;top:calc(env(safe-area-inset-top,12px)+8px);right:16px;width:7px;height:7px;border-radius:50%;z-index:999;transition:background .3s;}
#sd.sy{background:var(--orange);}#sd.ok{background:var(--green);}#sd.er{background:var(--red);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
</style>
</head>
<body>
<div id="sd"></div>
<div id="root">
  <div id="scroller"></div>
  <div id="tabs">
    <button class="tab on" id="tab-day" onclick="setView('day')">
      <div class="ti"><div class="ti-day">T</div></div>Today
    </button>
    <button class="tab" id="tab-week" onclick="setView('week')">
      <div class="ti"><div class="ti-week"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>Week
    </button>
    <button class="tab" id="tab-pay" onclick="setView('pay')">
      <div class="ti"><div class="ti-pay">€</div></div>Pay
    </button>
  </div>
</div>
<script>
var FB="https://amin-planer-default-rtdb.europe-west1.firebasedatabase.app";
var stimer=null,sdot=null;
function setSd(c){if(!sdot)sdot=document.getElementById("sd");sdot.className=c;}
function fbGet(cb){var x=new XMLHttpRequest();x.open("GET",FB+"/aminPlanner.json",true);x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){cb(null);}};x.onerror=function(){cb(null);};x.send();}
function fbPut(d){setSd("sy");var x=new XMLHttpRequest();x.open("PUT",FB+"/aminPlanner.json",true);x.setRequestHeader("Content-Type","application/json");x.onload=function(){setSd(x.status===200?"ok":"er");setTimeout(function(){setSd("");},2000);};x.onerror=function(){setSd("er");};x.send(JSON.stringify(d));}
function schedSync(){if(stimer)clearTimeout(stimer);stimer=setTimeout(function(){fbPut({checked:S.checked,customTasks:S.customTasks,lastShopping:S.lastShopping,shiftOverrides:S.shiftOverrides,customHours:S.customHours,closedDays:S.closedDays,extraShifts:S.extraShifts});},800);}

var RATE=17.65;
var aminShifts={27:"Spat",28:"Fruh",29:"Nacht",30:"Spat",31:"Fruh",32:"Spat",33:"Fruh",34:"Nacht",35:"Spat",36:"Fruh",37:"Spat",38:"Fruh",39:"Nacht",40:"Spat",41:"Fruh",42:"Spat",43:"Fruh",44:"Nacht",45:"Spat",46:"Fruh",47:"Spat",48:"Fruh",49:"Nacht",50:"Spat",51:"Fruh",52:"Spat",53:"Fruh"};
var SC={
  DayOff:{label:"Day Off",hours:"Rest",accent:"#30D158",bg:"rgba(48,209,88,.12)",depart:null,schedule:[{time:"07:00",task:"Wake up",type:"routine"},{time:"07:10",task:"2 glasses of water",type:"routine"},{time:"07:30",task:"Workout",type:"fitness"},{time:"08:00",task:"Shower + breakfast",type:"routine"},{time:"09:00",task:"Solo walk — 30 min",type:"fitness"},{time:"10:00",task:"Content creation",type:"creative"},{time:"13:00",task:"Lunch",type:"routine"},{time:"14:00",task:"Free time",type:"personal"},{time:"20:00",task:"Dinner",type:"routine"},{time:"22:00",task:"No screens",type:"routine"},{time:"23:00",task:"Sleep",type:"routine"}]},
  Fruh:{label:"Morning",hours:"06:00 — 14:00",accent:"#FF9F0A",bg:"rgba(255,159,10,.12)",depart:"05:15",schedule:[{time:"05:00",task:"Wake up",type:"routine"},{time:"05:05",task:"2 glasses of water",type:"routine"},{time:"05:10",task:"Workout — pull-ups + push-ups",type:"fitness"},{time:"05:35",task:"Shower + get ready",type:"routine"},{time:"05:55",task:"Light breakfast",type:"routine"},{time:"06:00",task:"Shift starts",type:"work"},{time:"14:00",task:"Shift ends",type:"work"},{time:"14:15",task:"Lunch",type:"routine"},{time:"14:45",task:"Solo walk — 30 min",type:"fitness"},{time:"15:30",task:"Content creation",type:"creative"},{time:"17:30",task:"Free time",type:"personal"},{time:"21:00",task:"Light dinner",type:"routine"},{time:"22:00",task:"No screens",type:"routine"},{time:"22:30",task:"Sleep",type:"routine"}]},
  Spat:{label:"Afternoon",hours:"14:00 — 22:00",accent:"#FF6B35",bg:"rgba(255,107,53,.12)",depart:"13:15",schedule:[{time:"05:30",task:"Wake up",type:"routine"},{time:"05:35",task:"2 glasses of water",type:"routine"},{time:"05:45",task:"Workout — pull-ups + push-ups",type:"fitness"},{time:"06:15",task:"Shower + get ready",type:"routine"},{time:"06:35",task:"Breakfast",type:"routine"},{time:"07:00",task:"Solo walk — 30 min",type:"fitness"},{time:"07:45",task:"Content creation",type:"creative"},{time:"10:00",task:"Free time",type:"personal"},{time:"12:00",task:"Lunch + prep for shift",type:"routine"},{time:"14:00",task:"Shift starts",type:"work"},{time:"22:00",task:"Shift ends",type:"work"},{time:"22:20",task:"Light dinner",type:"routine"},{time:"23:00",task:"No screens",type:"routine"},{time:"23:30",task:"Sleep",type:"routine"}]},
  Nacht:{label:"Night",hours:"22:00 — 06:00",accent:"#5AC8FA",bg:"rgba(90,200,250,.12)",depart:"21:15",schedule:[{time:"13:30",task:"Wake up (after night shift)",type:"routine"},{time:"13:35",task:"2 glasses of water",type:"routine"},{time:"13:45",task:"Breakfast / brunch",type:"routine"},{time:"14:15",task:"Solo walk — 30 min",type:"fitness"},{time:"15:00",task:"Workout — pull-ups + push-ups",type:"fitness"},{time:"15:30",task:"Shower",type:"routine"},{time:"16:00",task:"Content creation",type:"creative"},{time:"18:30",task:"Free time",type:"personal"},{time:"20:30",task:"Dinner",type:"routine"},{time:"21:00",task:"Prepare for shift",type:"routine"},{time:"22:00",task:"Shift starts",type:"work"},{time:"06:00",task:"Shift ends",type:"work"}]}
};
var TC={routine:"#8E8E93",work:"#FF9F0A",fitness:"#30D158",creative:"#BF5AF2",personal:"#5AC8FA",custom:"#FF453A",grocery:"#FFD60A"};
var pubHol=new Set(["2026-01-01","2026-04-03","2026-04-06","2026-05-01","2026-05-14","2026-05-25","2026-10-03","2026-10-31","2026-12-25","2026-12-26"]);
var grocList=["Protein — chicken, eggs, fish","Vegetables — fresh or frozen","Fruit — 2 to 3 varieties","Rice, oats, or pasta","Dairy — milk, yogurt, cheese","Bread or wraps","Healthy snacks — nuts, seeds","Water and drinks","Olive oil and sauces","Supplements"];
var SNAMES={Fruh:"Morning",Spat:"Afternoon",Nacht:"Night"};

function wkNum(date){var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));var dn=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dn);var ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7);}
function getMon(wk,yr){var j=new Date(yr,0,4),jd=j.getDay()||7,m=new Date(j);m.setDate(j.getDate()-jd+1+(wk-1)*7);return m;}
function dk(d){return d.toDateString();}
function isoD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function tMin(t){if(!t)return 9999;var p=t.split(":");return parseInt(p[0])*60+parseInt(p[1]);}
function isHol(d){return pubHol.has(isoD(d));}
function dayT(d){if(isHol(d))return"holiday";var w=d.getDay();if(w===0)return"sunday";if(w===6)return"saturday";return"weekday";}
function fmtE(n){return"\u20AC"+Math.round(n).toLocaleString("de-DE");}

// Lohnsteuer calculation - verified against Abrechnung (within €2)
function calcLSt(svBrutto){
  var net=svBrutto*(1-0.212);
  var annual=net*12;
  var zve=Math.max(0,annual-1266);
  var gfb=11604,tax=0;
  if(zve<=gfb){tax=0;}
  else if(zve<=17005){var y1=(zve-gfb)/10000;tax=(979.18*y1+1400.54)*y1;}
  else if(zve<=66760){var y2=(zve-17005)/10000;tax=(192.59*y2+2397.18)*y2+966.53;}
  else if(zve<=277825){tax=0.42*zve-10602.13;}
  else{tax=0.45*zve-18936.88;}
  return Math.max(0,Math.round(tax/12));
}

function calcPay(yr,mo){
  var dim=new Date(yr,mo+1,0).getDate();
  var wdSVB=0,wdSt=0,weSVB=0,weSt=0,dets=[];
  var dtC={saturday:"#FF9F0A",sunday:"#BF5AF2",holiday:"#FF453A"};
  var dtL={saturday:"Samstag",sunday:"Sonntag",holiday:"Feiertag"};
  for(var d=1;d<=dim;d++){
    var date=new Date(yr,mo,d),dkey=dk(date),wk=wkNum(date);
    var sk=S.shiftOverrides[dkey]||aminShifts[wk]||"Spat";
    if(sk==="DayOff") continue;
    var dt2=dayT(date);
    if(dt2==="weekday"){
      var h=S.customHours[dkey]||8;
      wdSVB+=h*RATE;
      if(sk==="Spat") wdSVB+=h*RATE*0.06;
      else if(sk==="Nacht"){wdSVB+=h*RATE*0.02;wdSt+=h*RATE*0.52;}
    } else {
      if(S.closedDays[dkey]) continue;
      var ess=(S.extraShifts||{})[dkey]||[];
      for(var si=0;si<ess.length;si++){
        var es=ess[si],h2=es.hours||0;
        if(!h2) continue;
        var base=h2*RATE,dz=0,dzSt=0,sz=0,szSt=0;
        weSVB+=base;
        if(dt2==="saturday"){dz=h2*RATE*1.5;weSVB+=dz;}
        else{dzSt=h2*RATE;weSt+=dzSt;}
        if(es.type==="Spat"){sz=h2*RATE*0.06;weSVB+=sz;}
        else if(es.type==="Nacht"){sz=h2*RATE*0.02;weSVB+=sz;szSt=h2*RATE*0.52;weSt+=szSt;}
        var tot=base+dz+dzSt+sz+szSt;
        dets.push({label:date.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}),type:dt2,sname:SNAMES[es.type]||es.type,hours:h2,total:tot,color:dtC[dt2]||"#888",typeLabel:dtL[dt2]||dt2});
      }
    }
  }
  var tSVB=wdSVB+weSVB,tSt=wdSt+weSt,gBrutto=tSVB+tSt;

    var btotal=div("brow");
    var btl=el("div",{style:{fontSize:"15px",fontWeight:"600"}});btl.textContent="Netto (est.)";
    var btv=el("div",{style:{fontSize:"17px",fontWeight:"600",color:"var(--green)",fontVariantNumeric:"tabular-nums"}});btv.textContent=fmtE(pay.netto);
    btotal.appendChild(btl);btotal.appendChild(btv);bkc.appendChild(btotal);
    sc.appendChild(bkc);

    // Weekend details
    if(pay.dets.length>0){
      var detc=div("card");var deth=div("card-hdr");var detl=el("div",{className:"card-label"});detl.textContent="Weekend Shifts Worked";deth.appendChild(detl);detc.appendChild(deth);
      pay.dets.forEach(function(d2){
        var dr=div("det-row");
        var dot=el("div",{className:"det-dot",style:{background:d2.color}});
        var dlabel=el("div",{className:"det-label"});dlabel.textContent=d2.label+" \u2014 "+d2.sname;
        var dtype=el("div",{className:"det-t"});dtype.textContent=d2.typeLabel;
        var dval=el("div",{className:"det-v",style:{color:d2.color}});dval.textContent=fmtE(d2.total);
        dr.appendChild(dot);dr.appendChild(dlabel);dr.appendChild(dtype);dr.appendChild(dval);detc.appendChild(dr);
      });
      sc.appendChild(detc);
    } else {
      var noWe=div("card");var noRow=div("row");var noT=el("div",{style:{flex:"1",fontSize:"14px",color:"var(--l3)",textAlign:"center",padding:"4px 0"}});noT.textContent="No weekend shifts logged. Add them in the Day view.";noRow.appendChild(noT);noWe.appendChild(noRow);sc.appendChild(noWe);
    }
    var note=el("div",{style:{textAlign:"center",padding:"14px 20px 8px",fontSize:"12px",color:"var(--l3)"}});note.textContent="Verified against Abrechnung \u00b7 StKl. 1 \u00b7 KiSt 9%";sc.appendChild(note);
  }

  sc.appendChild(el("div",{style:{height:"16px"}}));

  // ── MODALS ────────────────────────────────────────────────────────────────
  function mkSheet(onClose){var ov=el("div",{className:"overlay",onclick:onClose});var sh=div("sheet");sh.onclick=function(e){e.stopPropagation();};sh.appendChild(div("sh-handle"));ov.appendChild(sh);return{ov:ov,sh:sh};}
  function mkShOpt(ic,bg,color,name,sub,isAct,onClick){
    var opt=div("sh-opt");opt.onclick=onClick;
    var ico=el("div",{className:"sh-opt-ic",style:{background:bg,color:color}});ico.textContent=ic;
    var tx=el("div");var nm=el("div",{className:"sh-opt-name",style:{color:isAct?color:"var(--l)"}});nm.textContent=name;
    var sb=el("div",{className:"sh-opt-sub"});sb.textContent=sub;tx.appendChild(nm);tx.appendChild(sb);
    opt.appendChild(ico);opt.appendChild(tx);if(isAct){var ck=el("div",{className:"sh-chk"});ck.textContent="\u2713";opt.appendChild(ck);}
    return opt;
  }

  // Shift picker
  if(S.showShift){
    var curSk=S.shiftOverrides[dkey]||aminShifts[wk]||"Spat";
    var m1=mkSheet(function(){setState({showShift:false});});
    var t1=el("div",{className:"sh-title"});t1.textContent="Change Shift";
    var s1=el("div",{className:"sh-sub"});s1.textContent=sel.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
    m1.sh.appendChild(t1);m1.sh.appendChild(s1);
    var sicons={Fruh:"F",Spat:"S",Nacht:"N",DayOff:"\u2013"};
    var snames={Fruh:"Morning Shift",Spat:"Afternoon Shift",Nacht:"Night Shift",DayOff:"Day Off"};
    var shrs={Fruh:"06:00 \u2013 14:00 \u00b7 leave 05:15",Spat:"14:00 \u2013 22:00 \u00b7 leave 13:15",Nacht:"22:00 \u2013 06:00 \u00b7 leave 21:15",DayOff:"Relaxed routine"};
    ["Fruh","Spat","Nacht","DayOff"].forEach(function(s2){
      var sc2=SC[s2],isAct2=curSk===s2;
      var opt2=mkShOpt(sicons[s2],sc2.bg,sc2.accent,snames[s2],shrs[s2],isAct2,(function(ss){return function(){var no=Object.assign({},S.shiftOverrides);if(curSk===ss&&S.shiftOverrides[dkey])delete no[dkey];else no[dkey]=ss;setState({shiftOverrides:no,showShift:false});};})(s2));
      m1.sh.appendChild(opt2);
    });
    if(S.shiftOverrides[dkey]){var rst=el("div",{className:"sh-dest",onclick:function(){var no=Object.assign({},S.shiftOverrides);delete no[dkey];setState({shiftOverrides:no,showShift:false});}});rst.textContent="Reset to default";m1.sh.appendChild(rst);}
    var ca1=el("div",{className:"sh-cancel",onclick:function(){setState({showShift:false});}});ca1.textContent="Cancel";m1.sh.appendChild(ca1);
    document.body.appendChild(m1.ov);
  }

  // Hours picker
  if(S.showHours){
    var m2=mkSheet(function(){setState({showHours:false});});
    var t2=el("div",{className:"sh-title"});t2.textContent="Hours Worked";
    var s2=el("div",{className:"sh-sub"});s2.textContent=sel.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
    m2.sh.appendChild(t2);m2.sh.appendChild(s2);
    var hg=div("hg");
    [3,4,5,6,7,8].forEach(function(h){
      var hb=el("button",{className:"hg-btn"+(cHrs===h?" on":"")});hb.textContent=h+"h";
      hb.onclick=(function(hh){return function(){var nh=Object.assign({},S.customHours);nh[dkey]=hh;setState({customHours:nh,showHours:false});};})(h);
      hg.appendChild(hb);
    });
    m2.sh.appendChild(hg);
    if(cHrs){var rst2=el("div",{className:"sh-dest",onclick:function(){var nh=Object.assign({},S.customHours);delete nh[dkey];setState({customHours:nh,showHours:false});}});rst2.textContent="Reset to full shift";m2.sh.appendChild(rst2);}
    var ca2=el("div",{className:"sh-cancel",onclick:function(){setState({showHours:false});}});ca2.textContent="Cancel";m2.sh.appendChild(ca2);
    document.body.appendChild(m2.ov);
  }

  // Extra shift picker - uses setState for type/hours changes (no complex IIFEs)
  if(S.showExShift&&S.exShiftDate){
    var exDate=new Date(S.exShiftDate),exDt=dayT(exDate);
    var m3=mkSheet(function(){setState({showExShift:false,exShiftDate:null});});
    var t3=el("div",{className:"sh-title"});t3.textContent="Add Shift Worked";
    var s3=el("div",{className:"sh-sub"});s3.textContent=exDate.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
    m3.sh.appendChild(t3);m3.sh.appendChild(s3);
    // Shift type
    var etl=el("div",{style:{fontSize:"12px",fontWeight:"600",color:"var(--l2)",letterSpacing:".6px",textTransform:"uppercase",padding:"0 20px 4px"}});etl.textContent="Shift Type";
    m3.sh.appendChild(etl);
    var etnames={Fruh:"Morning (06\u201314)",Spat:"Afternoon (14\u201322)",Nacht:"Night (22\u201306)"};
    ["Fruh","Spat","Nacht"].forEach(function(s4){
      var sc4=SC[s4],isAct4=S.exType===s4;
      var opt4=mkShOpt(s4[0],sc4.bg,sc4.accent,etnames[s4],"",isAct4,(function(ss4){return function(){setState({exType:ss4});};})(s4));
      m3.sh.appendChild(opt4);
    });
    // Hours
    var ehl=el("div",{style:{fontSize:"12px",fontWeight:"600",color:"var(--l2)",letterSpacing:".6px",textTransform:"uppercase",padding:"12px 20px 4px"}});ehl.textContent="Hours Worked";
    m3.sh.appendChild(ehl);
    var ehg=div("hg");
    [4,5,6,7,8,9,10,11,12].forEach(function(h2){
      var ehb=el("button",{className:"hg-btn"+(S.exHours===h2?" on":"")});ehb.textContent=h2+"h";
      ehb.onclick=(function(hh2){return function(){setState({exHours:hh2});};})(h2);
      ehg.appendChild(ehb);
    });
    m3.sh.appendChild(ehg);
    var esave=el("button",{className:"add-submit",style:{margin:"0 16px 8px",width:"calc(100% - 32px)"},onclick:saveExShift});esave.textContent="Save Shift";
    m3.sh.appendChild(esave);
    var ca3=el("div",{className:"sh-cancel",onclick:function(){setState({showExShift:false,exShiftDate:null});}});ca3.textContent="Cancel";m3.sh.appendChild(ca3);
    document.body.appendChild(m3.ov);
  }

  // Grocery modal
  if(S.showGrocery){
    var m4=mkSheet(function(){setState({showGrocery:false});});
    var t4=el("div",{className:"sh-title"});t4.textContent="Grocery List";
    var s4=el("div",{className:"sh-sub"});s4.textContent="Check items as you shop";
    m4.sh.appendChild(t4);m4.sh.appendChild(s4);
    grocList.forEach(function(item,i){
      var gk="grocery-"+i,gd=!!S.checked[gk];
      var gr=el("div",{className:"gc-row"+(gd?" done":"")});
      gr.onclick=(function(k){return function(){var nc=Object.assign({},S.checked);nc[k]=!nc[k];setState({checked:nc});};})(gk);
      var glabel=el("div",{className:"gc-label"});glabel.textContent=item;
      gr.appendChild(mkGChk(gd));gr.appendChild(glabel);m4.sh.appendChild(gr);
    });
    var nrl=el("div",{style:{fontSize:"12px",fontWeight:"600",color:"var(--l2)",letterSpacing:".5px",textTransform:"uppercase",padding:"12px 16px 4px"}});nrl.textContent="Schedule Next Run";
    m4.sh.appendChild(nrl);
    var nrrow=div("nr");
    [4,5,6].forEach(function(d2){var nb=el("button",{className:"nr-btn"});nb.textContent="In "+d2+" days";nb.onclick=function(){schedNextShop(d2);};nrrow.appendChild(nb);});
    m4.sh.appendChild(nrrow);
    var ca4=el("div",{className:"sh-cancel",onclick:function(){setState({showGrocery:false});}});ca4.textContent="Done";m4.sh.appendChild(ca4);
    document.body.appendChild(m4.ov);
  }
}

render();
setInterval(render,30000);
</script>
</body>
</html>
